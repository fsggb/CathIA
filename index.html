Principe : construire du mobilier et des installations de camp sans clou, vis ni ficelle, avec des perches de bois vert (gaules) assemblées par tenon-mortaise ou mi-bois. Couper avec l'accord du propriétaire/ONF, souche ≤ 20 cm, bois de feu ramassé au sol. Laisser le site propre.
Outils : hachette canadienne (500-600 g), scie à bûches pour bois vert (pas d'égoïne), plane (couper dans le sens du fil), tarière avec manche (mèches 16, 22, 30 mm ; 10 à 40 mm au total ; 7 mm pour chevilles), ciseau et bédane de 20 mm, râpe, maillet (bois sur bois, fer sur fer), mètre, crayon, équerre, compas, pierre à aiguiser. Sécurité : main libre toujours derrière l'outil, outils très affûtés, gants.
Règles : règle du tiers (trou ou mortaise ≤ 1/3 du diamètre de la pièce percée ; la pièce doit faire au moins 3 fois le diamètre du trou). Entre deux trous laisser au moins le rayon de la mèche (jamais tangents). Deux trous perpendiculaires proches affaiblissent la pièce : les décaler. Pas de nœud à l'endroit d'un tenon. Éviter le trièdre (3 trous au même point). Un triangle est indéformable : écharpes, étais ; un mât s'étaye dans au moins 3 directions ; l'échelle (montants parallèles + barreaux) est la structure de base ; les grandes surfaces (siège, plateau) sont des échelles clayonnées.
Tenons : tenon rond à la plane (cylindrique si chevillé, légèrement conique s'il tient par enfoncement) ; embase soit conique (taillée à la hache/plane), soit sciée (épaulement net : plus rapide mais zone de faiblesse, à éviter si l'effort porte sur l'embase). Tenon plat : épaisseur = diamètre de la mèche, largeur = mortaise de 2-3 trous joints au ciseau ; il travaille de champ, plus solide en flexion. Mors d'âne : tenon plat dissymétrique (hêtre, sapin cassants). Dans le bois vert : mortaise et tenon débouchants, coin en bois dur dans une fente perpendiculaire aux fibres de la pièce mortaisée ; ne fixer qu'après séchage. Cheville de bois dur seulement si le bois est sec. Faux tenon : trou en bout + cheville si le tenon casse.
Mi-bois : deux pièces qui se croisent, entaillées à moitié (ou moins : entaille moins profonde = pièces plus fortes). Équarrir légèrement pour travailler sur un plat. Scie + ciseau. Souvent un boulon ou clou rivé. Calvaire : scier le fût au tiers de son diamètre.
Queues d'aronde (CathIA) : trapézoïdale (le tenon garde toute son épaisseur, seulement 2 traits de scie inclinés au bout ; rainure traversante peu profonde dans l'autre pièce, environ un tiers du diamètre) et à mi-bois (languette de demi-épaisseur, côtés inclinés). La rainure ne doit jamais couper entièrement la pièce. Chevilles : trou chevillé traversant plusieurs pièces. Quart de bois : on retire un quartier de la traverse sur une longueur pour poser un plateau.
Clayonnage : claies jointives (entraxe = somme des rayons, donc le diamètre), diamètre de 8 à 20 mm, tressées sous et sur les supports, une claie sur deux inversée, alterner pied et tête de gaule ; rayon de courbure minimal estimé à 20-25 fois le diamètre (estimation, pas une règle du livre).
Autres : enfourchement (mortaise ouverte d'un côté), queue d'aronde (2 traits de scie inclinés en sens inverses, la languette trapézoïdale sautée au ciseau, tenon trapèze à la plane : résiste à la traction, ex. pieds de table qui s'écartent), encoches en sifflet pour pièces comprimées, mi-bois à surlure pour rabouter.
Percement : vérifier le parallélisme avec un bout de bois témoin ; trou perpendiculaire : témoin ; oblique à 45° : triangle rectangle isocèle ; contreventement : trous obliques (amorcer par une entaille) ; tous les assemblages se montent en même temps. Tracer les longues lignes à la cinglée.
Pièces jointes : l'utilisateur peut joindre des images (photos de réalisations, croquis, plans) et des documents texte ; décris ce que tu vois puis propose la construction en froissartage et utilise les outils.
Unité d'affichage de CathIA : le centimètre (réglable en millimètres dans Paramètres) ; les outils de l'assistant restent en millimètres. Chevilles : elles ne se posent que sur des pièces qui se touchent et se croisent (jamais dans le plan des pièces) ; elles dépassent de 2 mm de chaque côté. Brêlage : seulement sur des pièces en contact. Clous cavaliers : petits U métalliques qui fixent les claies sur leurs supports (comptés dans la liste du matériel). PH (paraboloïde hyperbolique) : cordes tendues entre deux bords gauches, purement décoratif ; on règle le début, la longueur et l'espacement. Table : plateau fini à 75 cm du sol ; la hauteur d'axe des traverses tient compte du diamètre des claies ; 4ᵉ traverse plus fine au milieu pour le tressage dessous/dessus/dessous.
Mobilier du livre : établi de camp (2 perches Ø8-10 cm de 2-2,5 m, 1 cm d'écart, boulon, pieds de 80 cm dans trous de 22-30 mm, pieds écartés de 60 cm) ; tabouret tripode (3 pieds symétriques dans un demi-rondin) ; banc rustique (rondin refendu 1,5-2 m, 4 pieds) ; échelle ; chevalet à bûches (2 X en mi-bois reliés par un barreau) ; fauteuil carré (pieds avant 0,60 m, arrière 0,90 m, Ø50-60 mm ; bâtons de chaise Ø20-30 ; support de siège Ø40-57 ; accoudoir à 0,57 m).`;const AI_SYS=`Tu es l'assistant de CathIA, un logiciel de CAO pour le froissartage scout. Réponds en français, de façon courte et concrète. Tu peux consulter et modifier le modèle 3D avec les outils fournis, mais ne modifie le modèle que si l'utilisateur le demande. Unités : millimètres. Repère : X et Y horizontaux, Z vers le haut. Une traverse est un bois rond (diamètre, longueur) défini par ses deux extrémités. Les pieds se tenonnent à la hachette (tenon classique). Pour un tenon, la pièce 'a' porte le tenon et la pièce 'b' reçoit la mortaise : le bout de 'a' doit pénétrer dans 'b'. Pour un mi-bois, les deux pièces doivent se croiser et se recouvrir. Quand tu proposes une dimension, applique la règle du tiers.`;function md(t){const E=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"),IN=s=>E(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,"$1<i>$2</i>").replace(/~~([^~]+)~~/g,"<s>$1</s>");const L=String(t).replace(/\r/g,"").split("\n"),out=[];let i=0,ls=[],para=[];const fp=()=>{if(para.length){out.push("<p>"+para.map(IN).join("<br>")+"</p>");para=[]}},fl=()=>{while(ls.length)out.push("</"+ls.pop().t+">")};while(i<L.length){const l=L[i];if(/^```/.test(l)){fp();fl();const c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;out.push("<pre><code>"+E(c.join("\n"))+"</code></pre>");continue}if(/^\s*\|.*\|\s*$/.test(l)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/. =id),t=it&&it.html?await fetch(it.html).then(r=>{if(!r.ok)throw new Error("Modèle introuvable.");return r.text()}):await gcall("readLibraryItem",w,id);openText(t,name,{id,name,from:w});if(!FV)tabClick("Créer")}catch(e){msg("Ouverture impossible : "+e.message,7e3)}}function rateIt(id,n){needAuth(async()=>{try{const r=await gcall("rateModel",AUTH.tok,id,n),it=(LIBDATA.community||[]).find(x=>x.id==id);if(it){it.avg=r.avg;it.n=r.n;it.my=r.my}if(document.body.classList.contains("lb"))libRender();msg("Merci pour votre note.")}catch(e){msg(e.message,6e3)}})}function delPub(id){modal(`<h3>Retirer ce modèle ?</h3><p class="mu">Il disparaît de la bibliothèque publique (son historique reste dans le dépôt).</p><div class="r"><button class="dg" id="dp_y">Retirer</button><button onclick="closeMd()">Annuler</button></div>`);$("#dp_y").onclick=async()=>{try{await gcall("deleteModel",AUTH.tok,id);closeMd();libRefresh();msg("Modèle retiré.")}catch(e){closeMd();msg(e.message,7e3)}}}function libTabBtn(){const t=viewTab=="Bibliothèque de modèles"?"Modèles de référence":viewTab=="Modèles partagés"?"Modèles partagés":"";return t?`<button class="p" onclick="tabClick('${viewTab}')">${t}<span class="px" title="Fermer" onclick="event.stopPropagation();tabClick('Créer')">✕</span></button>`:""}cloudInit();if("serviceWorker"in navigator&&location.protocol=="https:"&&!inGas())navigator.serviceWorker.register("sw.js").catch(()=>{});
